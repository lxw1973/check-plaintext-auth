# ===== 统一加固模板（片段，按需合并到你的 server 块）=====

# 1) HTTP 统一跳 HTTPS（端口 80 的 server 块）
server {
    listen 80;
    server_name example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme-webroot; }
    location / { return 301 https://$host$request_uri; }
}

# 2) HTTPS 主站：默认全站鉴权，只显式放行例外
server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/nginx/ssl/example.crt;
    ssl_certificate_key /etc/nginx/ssl/example.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 默认拒绝：整站都要鉴权
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/example.htpasswd;

    # 例外：只放明确需要公开的路径
    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/acme-webroot; }
    location = /        { auth_basic off; return 302 /portal/; }
    location ^~ /portal/ { auth_basic off; }
}

# 3) 内部工具端口：只开 HTTPS，禁止明文
server {
    listen 5001 ssl http2;
    ssl_certificate     /etc/nginx/ssl/example.crt;
    ssl_certificate_key /etc/nginx/ssl/example.key;
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/example.htpasswd;
    error_page 497 =301 https://example.com:$server_port$request_uri;  # 明文请求自动升级
    location / { proxy_pass http://127.0.0.1:5000; }
}
